version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: classicmodels
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
    volumes:
      - ./app/sql/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    ports:
      - '5433:5432'

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:example@db:5432/classicmodels
      LOG_LEVEL: INFO
    ports:
      - '8000:8000'
      - '8502:8501'
    volumes:
      - .:/usr/src/app
    working_dir: /usr/src/app
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 & streamlit run app/streamlit_app.py --server.port 8501 --server.headless true"
